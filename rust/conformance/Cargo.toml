[package]
name = "silo-conformance"
version = "0.1.0"
edition = "2021"
description = "Replays requests against a reference and a candidate Silo server and diffs the answers."
publish = false

[[bin]]
name = "silo-conformance"
path = "src/main.rs"

[[bin]]
name = "conformance-mutproxy"
path = "src/bin/mutproxy.rs"

[lib]
name = "silo_conformance"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
silo-front = { path = "../crates/silo-front" }
