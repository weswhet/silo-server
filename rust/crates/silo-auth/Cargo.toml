[package]
name = "silo-auth"
version = "0.1.0"
description = "Sessions, refresh, API keys, device login, permissions, and the auth provider trait bridge. See src/lib.rs for exact scope."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silo-core = { path = "../silo-core" }
silo-gocompat = { path = "../silo-gocompat" }
silo-jwt = { path = "../silo-jwt" }
silo-pg = { path = "../silo-pg" }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
