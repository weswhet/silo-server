[package]
name = "silo-contracts"
version = "0.1.0"
description = "Embedded contracts and migrations, the settings contract, and the migration runner with its Go data migrations."
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
silo-gocompat = { path = "../silo-gocompat" }
silo-pg = { path = "../silo-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
