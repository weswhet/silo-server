# Postgres for the migrator's exit gate. Same image and settings as
# rust/conformance/baseline/compose.yml, in its own project and on its own port.
name: silo-pg-gate
services:
  postgres:
    image: pgvector/pgvector:pg18
    shm_size: 256mb
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    ports:
      - "127.0.0.1:25532:5432"
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo -d silo"]
      interval: 1s
      timeout: 3s
      retries: 60
