[package]
name = "silo-http"
version = "0.1.0"
description = "Ports of net/http and go-chi: HTTP/1.1 connection engine, chi router, ServeMux, ServeContent, compression."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum-core = "0.5"
brotli = "8"
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
rand = "0.9"
silo-gocompat = { path = "../silo-gocompat" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3"
tracing = "0.1"
zstd = "0.13"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"] }
brotli-decompressor = "5"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "differential"
path = "tests/differential/main.rs"
