[package]
name = "silo-api-v2"
version = "0.1.0"
description = "The /api/v2 wire kit: RFC 9457 problem+json, Huma's validation error mapping, entity-tag preconditions, cursors, and the shared response types, over internal/apiv2's contract."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
silo-core = { path = "../silo-core" }
silo-gocompat = { path = "../silo-gocompat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
serde_json = "1"
