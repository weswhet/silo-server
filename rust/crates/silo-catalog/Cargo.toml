[package]
name = "silo-catalog"
version = "0.1.0"
description = "The catalog read stack: the query engine (QueryDefinition, QueryBuilder, the preview plan, cursors) and the media item model."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
silo-gocompat = { path = "../silo-gocompat" }
silo-pg = { path = "../silo-pg" }
silo-store = { path = "../silo-store" }
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
