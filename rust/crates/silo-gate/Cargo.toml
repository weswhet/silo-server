[package]
name = "silo-gate"
version = "0.1.0"
description = "Policy (regorus + CompileCheck), rate limits, client IP resolution, and the auth gate's HTTP middleware chain. See src/lib.rs for exact scope."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
regorus = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "script", "sentinel"] }
silo-auth = { path = "../silo-auth" }
silo-config = { path = "../silo-config" }
silo-contracts = { path = "../silo-contracts" }
silo-core = { path = "../silo-core" }
silo-http = { path = "../silo-http" }
silo-jwt = { path = "../silo-jwt" }
silo-store = { path = "../silo-store" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
silo-gocompat = { path = "../silo-gocompat" }
silo-pg = { path = "../silo-pg" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
