[package]
name = "silo-gate"
version = "0.1.0"
description = "Policy (regorus + CompileCheck), rate limits, client IP resolution, and the auth gate's HTTP middleware chain. See src/lib.rs for exact scope."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
regorus = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silo-core = { path = "../silo-core" }
silo-gocompat = { path = "../silo-gocompat" }
silo-pg = { path = "../silo-pg" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
