[package]
name = "silo-runtime"
version = "0.1.0"
description = "Process-bootstrap infrastructure: database wiring, the Redis cache and event bus, Postgres advisory locks and storage admission, and outbound mail."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "script", "sentinel"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
silo-config = { path = "../silo-config" }
silo-contracts = { path = "../silo-contracts" }
silo-core = { path = "../silo-core" }
silo-gocompat = { path = "../silo-gocompat" }
silo-pg = { path = "../silo-pg" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-uuid-1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
