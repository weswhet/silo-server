[package]
name = "silo-config"
version = "0.1.0"
description = "Bootstrap config, server settings, the settings contract and resolver, startup env, and the robfig cron parser."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
silo-gocompat = { path = "../silo-gocompat" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
